<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DoseTrack</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background-color: #0f0c1a; color: white; margin: 0; font-family: sans-serif; min-height: 100vh;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const translations = {
            en: { title: "DoseTrack", add: "+ Add", remaining: "left", medName: "Medicine Name", dose: "Dose", stock: "Stock", time: "Time", save: "Save", newMed: "New Medicine" },
            sr: { title: "DoseTrack", add: "+ Dodaj", remaining: "preostalo", medName: "Ime leka", dose: "Doza", stock: "Zaliha", time: "Vreme", save: "Sačuvaj", newMed: "Novi lek" }
        };

        function App() {
            const [lang, setLang] = useState('sr');
            const t = translations[lang];
            const [meds, setMeds] = useState(() => JSON.parse(localStorage.getItem("myMeds")) || []);
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({ name: "", dose: "", stock: 30, time: "08:00" });

            useEffect(() => { localStorage.setItem("myMeds", JSON.stringify(meds)); }, [meds]);

            const toggleTaken = (id) => {
                setMeds(meds.map(m => m.id === id ? { ...m, taken: !m.taken, stock: !m.taken ? Math.max(0, m.stock - 1) : m.stock + 1 } : m));
            };

            const deleteMed = (id) => {
                setMeds(meds.filter(m => m.id !== id));
            };

            return (
                <div style={{ width: "100%", padding: "20px", boxSizing: "border-box" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "25px" }}>
                        <h1 style={{ fontSize: "28px", fontWeight: "bold", margin: 0 }}>{t.title}</h1>
                        <div style={{ display: "flex", gap: "10px" }}>
                            <button onClick={() => setLang(lang === 'en' ? 'sr' : 'en')} style={{ background: "#333", padding: "5px 10px", borderRadius: "8px", fontSize: "14px" }}>
                                {lang === 'en' ? '🇷🇸 SR' : '🇬🇧 EN'}
                            </button>
                            <button onClick={() => setShowForm(true)} style={{ background: "#a78bfa", padding: "8px 16px", borderRadius: "12px", fontWeight: "bold" }}>{t.add}</button>
                        </div>
                    </div>

                    {meds.map(med => (
                        <div key={med.id} style={{ background: "#19142e", padding: "20px", marginBottom: "15px", borderRadius: "16px", border: med.stock <= 5 ? "2px solid #ff6b6b" : "none" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start" }}>
                                <div onClick={() => toggleTaken(med.id)} style={{ flexGrow: 1, cursor: "pointer" }}>
                                    <span style={{ fontWeight: "bold", fontSize: "20px" }}>{med.name}</span>
                                    <div style={{ color: "#7c6a9e", marginBottom: "10px" }}>{med.dose}</div>
                                </div>
                                <button onClick={() => deleteMed(med.id)} style={{ background: "transparent", color: "#5e5775", padding: "2px 6px", borderRadius: "4px", border: "1px solid #332d4a", cursor: "pointer", fontSize: "10px", lineHeight: "1" }}>✕</button>
                            </div>
                            
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                <div onClick={() => toggleTaken
