<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DoseTrack</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background-color: #0f0c1a; color: white; margin: 0; font-family: sans-serif; min-height: 100vh;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const translations = {
            en: { title: "DoseTrack", add: "+ Add", remaining: "left", medName: "Medicine Name", dose: "Dose", stock: "Stock", time: "Time", save: "Save", newMed: "New Medicine" },
            sr: { title: "DoseTrack", add: "+ Dodaj", remaining: "preostalo", medName: "Ime leka", dose: "Doza", stock: "Zaliha", time: "Vreme", save: "Sačuvaj", newMed: "Novi lek" }
        };

        function App() {
            const [lang, setLang] = useState('sr');
            const t = translations[lang];
            const [meds, setMeds] = useState(() => JSON.parse(localStorage.getItem("myMeds")) || []);
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({ name: "", dose: "", stock: 30, time: "08:00" });

            useEffect(() => { localStorage.setItem("myMeds", JSON.stringify(meds)); }, [meds]);

            const toggleTaken = (id) => {
                setMeds(meds.map(m => m.id === id ? { ...m, taken: !m.taken, stock: !m.taken ? Math.max(0, m.stock - 1) : m.stock + 1 } : m));
            };

            const deleteMed = (id) => {
                setMeds(meds.filter(m => m.id !== id));
            };

            return (
                <div style={{ width: "100%", padding: "20px", boxSizing: "border-box" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "25px" }}>
                        <h1 style={{ fontSize: "28px", fontWeight: "bold", margin: 0 }}>{t.title}</h1>
                        <div style={{ display: "flex", gap: "10px" }}>
                            <button onClick={() => setLang(lang === 'en' ? 'sr' : 'en')} style={{ background: "#333", padding: "5px 10px", borderRadius: "8px", fontSize: "14px" }}>
                                {lang === 'en' ? '🇷🇸 SR' : '🇬🇧 EN'}
                            </button>
                            <button onClick={() => setShowForm(true)} style={{ background: "#a78bfa", padding: "8px 16px", borderRadius: "12px", fontWeight: "bold" }}>{t.add}</button>
                        </div>
                    </div>

                    {meds.map(med => (
                        <div key={med.id} style={{ background: "#19142e", padding: "20px", marginBottom: "15px", borderRadius: "16px", border: med.stock <= 5 ? "2px solid #ff6b6b" : "none" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start" }}>
                                <div onClick={() => toggleTaken(med.id)} style={{ flexGrow: 1, cursor: "pointer" }}>
                                    <span style={{ fontWeight: "bold", fontSize: "20px" }}>{med.name}</span>
                                    <div style={{ color: "#7c6a9e", marginBottom: "10px" }}>{med.dose}</div>
                                </div>
                                <button onClick={() => deleteMed(med.id)} style={{ background: "#ff6b6b", color: "white", padding: "4px 10px", borderRadius: "8px", border: "none", cursor: "pointer" }}>✕</button>
                            </div>
                            
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                <div onClick={() => toggleTaken(med.id)} style={{ background: "#10b981", padding: "4px 12px", borderRadius: "8px", fontWeight: "bold", color: "white", cursor: "pointer" }}>
                                    {med.time} {med.taken ? "✅" : "⭕"}
                                </div>
                                <span style={{ color: med.stock <= 5 ? "#ff6b6b" : "#7c6a9e", fontWeight: "bold" }}>{med.stock} {t.remaining}</span>
                            </div>
                        </div>
                    ))}

                    {showForm && (
                        <div style={{ position: "fixed", top: 0, left: 0, width: "100%", height: "100%", background: "#0f0c1a", padding: "20px", zIndex: 1000, boxSizing: "border-box" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "20px" }}>
                                <h2 style={{ fontSize: "24px", margin: 0 }}>{t.newMed}</h2>
                                <button onClick={() => setShowForm(false)} style={{ fontSize: "24px", background: "none", border: "none", color: "white", cursor: "pointer" }}>✕</button>
                            </div>
                            <input placeholder={t.medName} onChange={e => setForm({...form, name: e.target.value})} style={{ width: "100%", padding: "15px", marginBottom: "10px", background: "#19142e", borderRadius: "10px", color: "white" }} />
                            <input placeholder={t.dose} onChange={e => setForm({...form, dose: e.target.value})} style={{ width: "100%", padding: "15px", marginBottom: "10px", background: "#19142e", borderRadius: "10px", color: "white" }} />
                            <input type="number" placeholder={t.stock} onChange={e => setForm({...form, stock: parseInt(e.target.value)})} style={{ width: "100%", padding: "15px", marginBottom: "10px", background: "#19142e", borderRadius: "10px", color: "white" }} />
                            <input type="time" onChange={e => setForm({...form, time: e.target.value})} style={{ width: "100%", padding: "15px", marginBottom: "20px", background: "#19142e", borderRadius: "10px", color: "white" }} />
                            <button onClick={() => { setMeds([...meds, { id: Date.now(), ...form, taken: false }]); setShowForm(false); }} style={{ width: "100%", padding: "15px", background: "#a78bfa", borderRadius: "10px", fontWeight: "bold", cursor: "pointer" }}>{t.save}</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
