<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DoseTrack</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="background:#0f0c1a; color:white; margin:0; padding:0; font-family:sans-serif;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [lang, setLang] = useState('sr');
            const [meds, setMeds] = useState(() => JSON.parse(localStorage.getItem("myMeds") || "[]"));
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({ name: "", dose: "", stock: 30, time: "08:00" });

            useEffect(() => { localStorage.setItem("myMeds", JSON.stringify(meds)); }, [meds]);

            const t = {
                sr: { title: "DoseTrack", add: "+ Dodaj", close: "✕ Zatvori", save: "Sačuvaj", name: "Ime leka", dose: "Doza", stock: "Zaliha" },
                en: { title: "DoseTrack", add: "+ Add", close: "✕ Close", save: "Save", name: "Med name", dose: "Dose", stock: "Stock" }
            };

            return (
                <div style={{ width: "100%", padding: "15px", boxSizing: "border-box" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "20px" }}>
                        <h1 style={{ fontSize: "24px", margin: 0 }}>{t[lang].title}</h1>
                        <div>
                            <button onClick={() => setLang(lang === 'sr' ? 'en' : 'sr')} style={{ background: "#333", color: "white", border: "none", padding: "5px 10px", borderRadius: "5px", marginRight: "10px" }}>{lang.toUpperCase()}</button>
                            <button onClick={() => setShowForm(true)} style={{ background: "#a78bfa", padding: "5px 15px", borderRadius: "8px", border: "none" }}>{t[lang].add}</button>
                        </div>
                    </div>

                    {meds.map(m => (
                        <div key={m.id} onClick={() => setMeds(meds.map(x => x.id === m.id ? {...x, taken: !x.taken} : x))} style={{ background: "#19142e", padding: "15px", marginBottom: "10px", borderRadius: "10px" }}>
                            <div style={{ fontSize: "18px", fontWeight: "bold" }}>{m.name}</div>
                            <div style={{ marginTop: "5px", background: "#10b981", padding: "5px 10px", borderRadius: "5px", display: "inline-block" }}>{m.time} {m.taken ? "✅" : "⭕"}</div>
                        </div>
                    ))}

                    {showForm && (
                        <div style={{ position: "fixed", top: 0, left: 0, width: "100%", height: "100%", background: "#0f0c1a", padding: "20px", boxSizing: "border-box", zIndex: 999 }}>
                            <button onClick={() => setShowForm(false)} style={{ background: "none", border: "none", color: "white", fontSize: "24px", marginBottom: "20px" }}>{t[lang].close}</button>
                            <input placeholder={t[lang].name} onChange={e => setForm({...form, name: e.target.value})} style={{ display: "block", width: "100%", padding: "15px", marginBottom: "10px", borderRadius: "8px", border: "none", fontSize: "16px" }} />
                            <input placeholder={t[lang].dose} onChange={e => setForm({...form, dose: e.target.value})} style={{ display: "block", width: "100%", padding: "15px", marginBottom: "10px", borderRadius: "8px", border: "none", fontSize: "16px" }} />
                            <input type="number" placeholder={t[lang].stock} onChange={e => setForm({...form, stock: e.target.value})} style={{ display: "block", width: "100%", padding: "15px", marginBottom: "20px", borderRadius: "8px", border: "none", fontSize: "16px" }} />
                            <button onClick={() => { setMeds([...meds, {id: Date.now(), ...form}]); setShowForm(false); }} style={{ background: "#a78bfa", width: "100%", padding: "15px", borderRadius: "8px", border: "none", fontSize: "16px", fontWeight: "bold" }}>{t[lang].save}</button>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
