<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoseTrack</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#0f0c1a; color:white; margin:0; padding:0;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [meds, setMeds] = useState(() => JSON.parse(localStorage.getItem("myMeds") || "[]"));
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({ name: "", dose: "", stock: 30, time: "08:00" });

            useEffect(() => { localStorage.setItem("myMeds", JSON.stringify(meds)); }, [meds]);

            return (
                <div style={{ padding: "10px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "20px" }}>
                        <h1 style={{ fontSize: "24px" }}>DoseTrack</h1>
                        <button onClick={() => setShowForm(true)} style={{ background: "#a78bfa", padding: "5px 15px", borderRadius: "8px" }}>+ Dodaj</button>
                    </div>

                    {meds.map(m => (
                        <div key={m.id} onClick={() => setMeds(meds.map(x => x.id === m.id ? {...x, taken: !x.taken} : x))} style={{ background: "#19142e", padding: "15px", marginBottom: "10px", borderRadius: "10px" }}>
                            <div style={{ fontSize: "18px" }}>{m.name}</div>
                            <div style={{ background: "#10b981", padding: "5px", borderRadius: "5px", display: "inline-block" }}>{m.time} {m.taken ? "✅" : "⭕"}</div>
                        </div>
                    ))}

                    {showForm && (
                        <div style={{ position: "fixed", top: 0, left: 0, width: "100%", height: "100%", background: "#0f0c1a", padding: "20px" }}>
                            <button onClick={() => setShowForm(false)} style={{ fontSize: "30px" }}>✕ ZATVORI</button>
                            <input placeholder="Ime" onChange={e => setForm({...form, name: e.target.value})} style={{ display: "block", width: "100%", padding: "10px", margin: "10px 0", color: "black" }} />
                            <button onClick={() => { setMeds([...meds, {id: Date.now(), ...form}]); setShowForm(false); }} style={{ background: "#a78bfa", width: "100%", padding: "10px" }}>SAČUVAJ</button>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
