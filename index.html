<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DoseTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f0c1a; }
    body { font-family: 'DM Sans', sans-serif; color: #f0eaf8; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    input, button { font-family: inherit; }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.3; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #2a1f3d; border-radius: 4px; }
    @keyframes slideUp    { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
    @keyframes fadeIn     { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulseBorder{ 0%,100%{ box-shadow:0 0 0 0 #ff6b6b15; } 50%{ box-shadow:0 0 16px 3px #ff6b6b30; } }
    @keyframes toastIn    { from { opacity:0; transform:translate(-50%,10px); } to { opacity:1; transform:translate(-50%,0); } }
    @keyframes toastOut   { from { opacity:1; } to { opacity:0; transform:translate(-50%,-6px); } }
    @keyframes scaleIn    { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:scale(1); } }
    .card      { animation: fadeIn 0.3s ease both; }
    .drawer    { animation: slideUp 0.32s cubic-bezier(.22,.68,0,1.2) both; }
    .confirm-box { animation: scaleIn 0.2s ease both; }
    .toast-in  { animation: toastIn  0.25s ease both; }
    .toast-out { animation: toastOut 0.25s ease both; }
    .tab-btn   { flex:1; padding:8px 0; border-radius:9px; border:none; font-size:13px; font-weight:600; transition:all .2s; }
    .med-card  { border-radius:16px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:all .2s; border:1.5px solid transparent; }
    .med-card:active { transform:scale(.98); }
    .check-box { width:26px; height:26px; border-radius:8px; border:2px solid #3a2f5a; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; }
    .form-input{ display:block; width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid #2a1f3d; background:#12101e; color:#f0eaf8; font-size:15px; transition:border-color .2s; }
    .form-input:focus { border-color:#a78bfa; outline:none; }
    .form-input::placeholder { color:#3a2f5a; }
    .form-label{ font-size:11px; color:#7c6a9e; font-weight:600; letter-spacing:.1em; text-transform:uppercase; display:block; margin-bottom:6px; }
    .day-btn   { flex:1; padding:8px 0; border-radius:8px; border:none; font-size:12px; font-weight:700; transition:all .15s; }
    .save-btn  { width:100%; padding:14px; border-radius:14px; border:none; background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; font-size:15px; font-weight:700; transition:opacity .15s; }
    .save-btn:active { opacity:.85; }
    .fab       { position:fixed; bottom:28px; right:max(24px,calc(50% - 186px)); width:54px; height:54px; border-radius:16px; border:none; background:linear-gradient(135deg,#a78bfa,#7c3aed); color:#fff; font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px #a78bfa44; z-index:40; transition:transform .15s; cursor:pointer; }
    .fab:active { transform:scale(.93); }
    .overlay   { position:fixed; inset:0; background:#0a0716cc; backdrop-filter:blur(6px); z-index:50; display:flex; align-items:flex-end; }
    .overlay-panel { width:100%; max-width:440px; margin:0 auto; background:#1a1330; border-radius:22px 22px 0 0; padding:24px 24px 44px; border:1.5px solid #2a1f3d; border-bottom:none; max-height:92vh; overflow-y:auto; }
    .close-btn { background:none; border:none; color:#7c6a9e; font-size:22px; line-height:1; padding:4px; border-radius:6px; transition:color .15s; }
    .close-btn:hover { color:#f0eaf8; }
    .lang-btn  { background:#1a1330; border:1.5px solid #2a1f3d; color:#a78bfa; font-size:12px; font-weight:700; padding:5px 11px; border-radius:8px; letter-spacing:.05em; transition:all .15s; }
    .lang-btn:hover { border-color:#a78bfa; }
    .del-btn   { background:#2a1212; border:1px solid #ff6b6b33; border-radius:8px; color:#ff8a8a; width:30px; height:30px; font-size:15px; display:flex; align-items:center; justify-content:center; transition:all .15s; flex-shrink:0; }
    .del-btn:hover { background:#3a1a1a; border-color:#ff6b6b66; }
    .confirm-overlay { position:fixed; inset:0; background:#0a0716dd; backdrop-filter:blur(8px); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
    .confirm-panel   { background:#1a1330; border:1.5px solid #ff6b6b44; border-radius:20px; padding:28px 24px; max-width:320px; width:100%; text-align:center; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const T = {
  en: {
    today:"Today", allMeds:"All Meds", addMed:"Add Medication",
    noToday:"No doses scheduled today", noMeds:"No medications added yet",
    lowStock:"LOW STOCK WARNING", pillsLeft:"pills left",
    soon:"⚡ Soon", missed:"⏰ Missed",
    icon:"Icon", medName:"Medication Name", dosage:"Dosage",
    time:"Time", stockPills:"Stock (pills)", scheduleDays:"Schedule Days",
    save:"Save Medication", cancel:"Cancel",
    stockLabel:"Stock", left:"left",
    deleteConfirmTitle:"Remove Medication",
    deleteConfirmMsg: n => `Remove "${n}" from your list? This cannot be undone.`,
    deleteConfirmYes:"Yes, Remove", deleteConfirmNo:"Keep It",
    toastAdded:"💊 Medication added!", toastRemoved:"🗑 Removed",
    toastTaken: n => `✓ ${n} taken!`, toastUntaken: n => `↩ ${n} unmarked`,
    dayNames:["Su","Mo","Tu","We","Th","Fr","Sa"],
    daysFull:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
  },
  sr: {
    today:"Danas", allMeds:"Svi Lekovi", addMed:"Dodaj Lek",
    noToday:"Nema doza zakazanih za danas", noMeds:"Još uvek nema dodatih lekova",
    lowStock:"UPOZORENJE — MALA ZALIHA", pillsLeft:"tableta ostalo",
    soon:"⚡ Uskoro", missed:"⏰ Propušteno",
    icon:"Ikona", medName:"Naziv leka", dosage:"Doza",
    time:"Vreme", stockPills:"Zaliha (tablete)", scheduleDays:"Dani uzimanja",
    save:"Sačuvaj Lek", cancel:"Otkaži",
    stockLabel:"Zaliha", left:"ostalo",
    deleteConfirmTitle:"Ukloni Lek",
    deleteConfirmMsg: n => `Ukloniti "${n}" sa liste? Ovo se ne može poništiti.`,
    deleteConfirmYes:"Da, ukloni", deleteConfirmNo:"Zadrži",
    toastAdded:"💊 Lek dodat!", toastRemoved:"🗑 Uklonjeno",
    toastTaken: n => `✓ ${n} uzeto!`, toastUntaken: n => `↩ ${n} odznačeno`,
    dayNames:["Ne","Po","Ut","Sr","Če","Pe","Su"],
    daysFull:["Nedelja","Ponedeljak","Utorak","Sreda","Četvrtak","Petak","Subota"],
  }
};

const ICONS = ["💊","💉","🌿","🧪","🫀","🧬","⚡","🌟"];
function todayKey() { return new Date().toISOString().slice(0,10); }
function fmtTime(t) {
  const [h,m] = t.split(":").map(Number);
  return `${h%12||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`;
}
function loadMeds() { try { return JSON.parse(localStorage.getItem("dt_meds_v2")||"[]"); } catch{ return []; } }
function loadLang() { return localStorage.getItem("dt_lang")||"sr"; }

function Ring({ done, total }) {
  const r=36, c=2*Math.PI*r, pct=total?done/total:0;
  return (
    <div style={{position:"relative",width:84,height:84,flexShrink:0}}>
      <svg width="84" height="84" style={{transform:"rotate(-90deg)"}}>
        <circle cx="42" cy="42" r={r} fill="none" stroke="#2a1f3d" strokeWidth="7"/>
        <circle cx="42" cy="42" r={r} fill="none" stroke={pct===1?"#4ade80":"#a78bfa"} strokeWidth="7"
          strokeDasharray={c} strokeDashoffset={c*(1-pct)} strokeLinecap="round"
          style={{transition:"stroke-dashoffset .6s ease, stroke .4s"}}/>
      </svg>
      <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",textAlign:"center",lineHeight:1}}>
        <div style={{fontSize:17,fontWeight:700,color:pct===1?"#4ade80":"#f0eaf8"}}>{done}/{total}</div>
        <div style={{fontSize:10,color:"#7c6a9e",marginTop:2}}>today</div>
      </div>
    </div>
  );
}

function Toast({ msg, leaving }) {
  return (
    <div className={leaving?"toast-out":"toast-in"} style={{
      position:"fixed",bottom:96,left:"50%",transform:"translateX(-50%)",zIndex:200,
      background:"#2a1f3d",color:"#f0eaf8",padding:"10px 20px",borderRadius:12,
      fontSize:13,fontWeight:600,border:"1px solid #3a2f5a",
      boxShadow:"0 8px 24px #0009",whiteSpace:"nowrap",pointerEvents:"none"
    }}>{msg}</div>
  );
}

function ConfirmDialog({ name, t, onConfirm, onCancel }) {
  return (
    <div className="confirm-overlay" onClick={onCancel}>
      <div className="confirm-panel confirm-box" onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:32,marginBottom:12}}>🗑️</div>
        <div style={{fontWeight:700,fontSize:17,marginBottom:10}}>{t.deleteConfirmTitle}</div>
        <div style={{fontSize:14,color:"#9a8abf",marginBottom:24,lineHeight:1.5}}>{t.deleteConfirmMsg(name)}</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onCancel} style={{
            flex:1,padding:"12px",borderRadius:12,border:"1.5px solid #2a1f3d",
            background:"transparent",color:"#9a8abf",fontSize:14,fontWeight:600
          }}>{t.deleteConfirmNo}</button>
          <button onClick={onConfirm} style={{
            flex:1,padding:"12px",borderRadius:12,border:"none",
            background:"linear-gradient(135deg,#e05555,#b91c1c)",color:"#fff",fontSize:14,fontWeight:700
          }}>{t.deleteConfirmYes}</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang]         = useState(loadLang);
  const [meds, setMeds]         = useState(loadMeds);
  const [view, setView]         = useState("today");
  const [showForm, setShowForm] = useState(false);
  const [now, setNow]           = useState(new Date());
  const [toast, setToast]       = useState(null);
  const [toastLeave, setToastLeave] = useState(false);
  const [confirmId, setConfirmId]   = useState(null);
  const toastTimer = useRef(null);
  const [form, setForm] = useState({
    name:"", dose:"", stock:"", time:"08:00",
    days:[0,1,2,3,4,5,6], color:"#4FC3F7", icon:"💊"
  });

  const t = T[lang];

  useEffect(() => { localStorage.setItem("dt_meds_v2", JSON.stringify(meds)); }, [meds]);
  useEffect(() => { localStorage.setItem("dt_lang", lang); }, [lang]);
  useEffect(() => {
    const tick = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(tick);
  }, []);

  const today = now.getDay();
  const tKey  = todayKey();

  const doses = meds
    .filter(m => m.days.includes(today))
    .flatMap(m => m.times.map(time => ({ med:m, time, id:`${m.id}-${time}` })))
    .sort((a,b) => a.time.localeCompare(b.time));

  const doneCount = doses.filter(d => d.med.taken?.[`${tKey}-${d.time}`]).length;
  const lowStock  = meds.filter(m => typeof m.stock==="number" && m.stock<=5);

  function fire(msg) {
    clearTimeout(toastTimer.current);
    setToastLeave(false);
    setToast(msg);
    toastTimer.current = setTimeout(() => {
      setToastLeave(true);
      setTimeout(() => setToast(null), 260);
    }, 2200);
  }

  function toggleTaken(medId, time) {
    const k = `${tKey}-${time}`;
    setMeds(prev => prev.map(m => {
      if (m.id !== medId) return m;
      const wasTaken = !!m.taken?.[k];
      const taken = { ...m.taken, [k]: !wasTaken };
      const stock = typeof m.stock==="number" ? Math.max(0, m.stock+(wasTaken?1:-1)) : m.stock;
      fire(wasTaken ? t.toastUntaken(m.name) : t.toastTaken(m.name));
      return { ...m, taken, stock };
    }));
  }

  function confirmRemove(id) { setConfirmId(id); }

  function doRemove() {
    setMeds(prev => prev.filter(m => m.id !== confirmId));
    setConfirmId(null);
    fire(t.toastRemoved);
  }

  function addMed() {
    if (!form.name.trim()) return;
    setMeds(prev => [...prev, {
      id:Date.now(), name:form.name.trim(), dose:form.dose.trim(),
      stock:form.stock!==""?Math.max(0,parseInt(form.stock)||0):null,
      times:[form.time], days:[...form.days].sort(),
      color:form.color, icon:form.icon, taken:{}
    }]);
    setForm({ name:"", dose:"", stock:"", time:"08:00", days:[0,1,2,3,4,5,6], color:"#4FC3F7", icon:"💊" });
    setShowForm(false);
    fire(t.toastAdded);
  }

  function toggleDay(i) {
    setForm(f => ({ ...f, days: f.days.includes(i)?f.days.filter(d=>d!==i):[...f.days,i] }));
  }

  const confirmMed = meds.find(m => m.id === confirmId);

  return (
    <div style={{minHeight:"100vh",background:"#0f0c1a",display:"flex",flexDirection:"column",maxWidth:440,margin:"0 auto",position:"relative"}}>
      <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0,
        background:"radial-gradient(ellipse 80% 50% at 50% -10%,#2d1b6920,transparent 70%),radial-gradient(ellipse 60% 40% at 85% 85%,#1a3a4418,transparent 60%)"}}/>

      <header style={{position:"relative",zIndex:1,padding:"22px 24px 0"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:11,color:"#a78bfa",fontWeight:600,letterSpacing:".12em",textTransform:"uppercase",marginBottom:4}}>
              {t.daysFull[today]}, {now.toLocaleDateString(lang==="sr"?"sr-RS":"en-US",{month:"short",day:"numeric"})}
            </div>
            <h1 style={{fontSize:28,fontWeight:700,margin:0,letterSpacing:"-0.5px"}}>
              Dose<span style={{color:"#a78bfa"}}>Track</span>
            </h1>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:10}}>
            <button className="lang-btn" onClick={()=>setLang(l=>l==="sr"?"en":"sr")}>
              {lang==="sr"?"🇷🇸 SR":"🇬🇧 EN"}
            </button>
            <Ring done={doneCount} total={doses.length}/>
          </div>
        </div>
        <div style={{display:"flex",gap:5,marginTop:18,background:"#1a1330",borderRadius:13,padding:4}}>
          {[["today",t.today],["all",t.allMeds]].map(([k,lbl])=>(
            <button key={k} className="tab-btn" onClick={()=>setView(k)} style={{
              background:view===k?"#a78bfa":"transparent",
              color:view===k?"#0f0c1a":"#7c6a9e"
            }}>{lbl}</button>
          ))}
        </div>
      </header>

      {lowStock.length>0&&(
        <div style={{position:"relative",zIndex:1,margin:"12px 24px 0",borderRadius:14,
          background:"linear-gradient(135deg,#3a1212,#2a0e0e)",border:"1.5px solid #ff6b6b40",
          padding:"12px 16px",animation:"pulseBorder 2s ease-in-out infinite"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:20}}>⚠️</span>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:"#ff8a8a",letterSpacing:".06em"}}>{t.lowStock}</div>
              <div style={{fontSize:12,color:"#cc5555",marginTop:2,lineHeight:1.4}}>
                {lowStock.map(m=>`${m.name} — ${m.stock} ${t.pillsLeft}`).join(" · ")}
              </div>
            </div>
          </div>
        </div>
      )}

      <main style={{flex:1,overflowY:"auto",padding:"14px 24px 96px",position:"relative",zIndex:1}}>
        {view==="today"&&(
          doses.length===0
            ?<div style={{textAlign:"center",color:"#3a2f5a",marginTop:60}}>
               <div style={{fontSize:40,marginBottom:12}}>🎉</div>
               <div style={{fontSize:14}}>{t.noToday}</div>
             </div>
            :doses.map(({med,time,id},i)=>{
              const k=`${tKey}-${time}`, taken=!!med.taken?.[k];
              const [h]=time.split(":").map(Number);
              const nowMin=now.getHours()*60+now.getMinutes(), doseMin=h*60+parseInt(time.split(":")[1]);
              const soon=!taken&&Math.abs(doseMin-nowMin)<=30, missed=!taken&&doseMin<nowMin;
              return (
                <div key={id} className="card" style={{animationDelay:`${i*40}ms`}} onClick={()=>toggleTaken(med.id,time)}>
                  <div className="med-card" style={{
                    background:taken?"#141f14":"#19142e",
                    borderColor:taken?"#2a422a":soon?med.color+"55":"#2a1f3d",
                    opacity:taken?.7:1,
                    boxShadow:soon&&!taken?`0 0 20px ${med.color}18`:""
                  }}>
                    <div style={{width:44,height:44,borderRadius:12,background:`${med.color}20`,
                      display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>
                      {med.icon||"💊"}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <span style={{fontWeight:700,fontSize:15,color:taken?"#4a8a4a":"#f0eaf8"}}>{med.name}</span>
                        <span style={{fontSize:11,fontWeight:600,color:soon&&!taken?med.color:missed?"#ff6b6b":"#4a3f6b"}}>
                          {soon&&!taken?t.soon:missed?t.missed:fmtTime(time)}
                        </span>
                      </div>
                      <div style={{fontSize:12,color:"#7c6a9e",marginTop:3,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                        <span>{med.dose} · {fmtTime(time)}</span>
                        {typeof med.stock==="number"&&(
                          <span style={{padding:"1px 8px",borderRadius:20,fontSize:11,fontWeight:700,
                            background:med.stock<=5?"#3a1212":"#1e1a2e",
                            color:med.stock<=5?"#ff8a8a":"#6b5f8a",
                            border:`1px solid ${med.stock<=5?"#ff6b6b40":"#2a1f3d"}`}}>
                            {med.stock<=5?"⚠️ ":""}{med.stock} {t.left}
                          </span>
                        )}
                      </div>
                    </div>
                    <div className="check-box" style={{borderColor:taken?"#4a8a4a":"#3a2f5a",background:taken?"#4a8a4a":"transparent"}}>
                      {taken&&<span style={{fontSize:13,color:"#fff",lineHeight:1}}>✓</span>}
                    </div>
                  </div>
                </div>
              );
            })
        )}

        {view==="all"&&(
          meds.length===0
            ?<div style={{textAlign:"center",color:"#3a2f5a",marginTop:60}}>
               <div style={{fontSize:40,marginBottom:12}}>💊</div>
               <div style={{fontSize:14}}>{t.noMeds}</div>
             </div>
            :meds.map((med,i)=>(
              <div key={med.id} className="card" style={{
                animationDelay:`${i*40}ms`,marginBottom:12,padding:"15px",
                borderRadius:16,background:"#19142e",border:"1.5px solid #2a1f3d",
                position:"relative",overflow:"hidden"
              }}>
                <div style={{position:"absolute",top:0,left:0,bottom:0,width:4,
                  background:`linear-gradient(to bottom,${med.color},${med.color}55)`}}/>
                <div style={{paddingLeft:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:22}}>{med.icon||"💊"}</span>
                      <div>
                        <div style={{fontWeight:700,fontSize:15}}>{med.name}</div>
                        {med.dose&&<div style={{fontSize:12,color:"#7c6a9e",marginTop:1}}>{med.dose}</div>}
                      </div>
                    </div>
                    <button className="del-btn" onClick={e=>{e.stopPropagation();confirmRemove(med.id);}}>🗑</button>
                  </div>
                  <div style={{marginTop:10,display:"flex",gap:5,flexWrap:"wrap"}}>
                    {t.dayNames.map((d,idx)=>(
                      <div key={idx} style={{
                        width:28,height:28,borderRadius:7,display:"flex",alignItems:"center",
                        justifyContent:"center",fontSize:11,fontWeight:600,
                        background:med.days.includes(idx)?`${med.color}28`:"#12101e",
                        color:med.days.includes(idx)?med.color:"#2a1f3d",
                        border:`1px solid ${med.days.includes(idx)?med.color+"44":"#2a1f3d"}`
                      }}>{d}</div>
                    ))}
                  </div>
                  <div style={{marginTop:9,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                    {med.times.map(tm=>(
                      <span key={tm} style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,
                        background:`${med.color}20`,color:med.color}}>{fmtTime(tm)}</span>
                    ))}
                    {typeof med.stock==="number"&&(
                      <span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,marginLeft:"auto",
                        background:med.stock<=5?"#3a1212":"#1e1a2e",
                        color:med.stock<=5?"#ff8a8a":"#9a8abf",
                        border:`1px solid ${med.stock<=5?"#ff6b6b44":"#2a1f3d"}`}}>
                        {med.stock<=5?"⚠️ ":"💊 "}{t.stockLabel}: {med.stock}
                      </span>
                    )}
                  </div>
                </div>
              </div>
            ))
        )}
      </main>

      <button className="fab" onClick={()=>setShowForm(true)}>+</button>

      {showForm&&(
        <div className="overlay" onClick={()=>setShowForm(false)}>
          <div className="overlay-panel drawer" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
              <span style={{fontWeight:700,fontSize:18}}>{t.addMed}</span>
              <button className="close-btn" onClick={()=>setShowForm(false)}>✕</button>
            </div>
            <div style={{marginBottom:16}}>
              <label className="form-label">{t.icon}</label>
              <div style={{display:"flex",gap:8}}>
                {ICONS.map(ic=>(
                  <button key={ic} onClick={()=>setForm(f=>({...f,icon:ic}))} style={{
                    width:38,height:38,borderRadius:9,
                    border:`2px solid ${form.icon===ic?"#a78bfa":"#2a1f3d"}`,
                    background:form.icon===ic?"#2a1f3d":"#12101e",fontSize:18,transition:"all .15s"
                  }}>{ic}</button>
                ))}
              </div>
            </div>
            <div style={{marginBottom:14}}>
              <label className="form-label">{t.medName}</label>
              <input className="form-input" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Aspirin"/>
            </div>
            <div style={{marginBottom:14}}>
              <label className="form-label">{t.dosage}</label>
              <input className="form-input" value={form.dose} onChange={e=>setForm(f=>({...f,dose:e.target.value}))} placeholder="e.g. 100mg"/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
              <div>
                <label className="form-label">{t.time}</label>
                <input type="time" className="form-input" value={form.time} onChange={e=>setForm(f=>({...f,time:e.target.value}))}/>
              </div>
              <div>
                <label className="form-label">{t.stockPills}</label>
                <input type="number" className="form-input" min="0" value={form.stock} onChange={e=>setForm(f=>({...f,stock:e.target.value}))} placeholder="npr. 30"/>
              </div>
            </div>
            <div style={{marginBottom:22}}>
              <label className="form-label">{t.scheduleDays}</label>
              <div style={{display:"flex",gap:6}}>
                {t.dayNames.map((d,i)=>(
                  <button key={i} className="day-btn" onClick={()=>toggleDay(i)} style={{
                    background:form.days.includes(i)?"#a78bfa":"#2a1f3d",
                    color:form.days.includes(i)?"#0f0c1a":"#7c6a9e"
                  }}>{d}</button>
                ))}
              </div>
            </div>
            <button className="save-btn" onClick={addMed}>{t.save}</button>
            <button onClick={()=>setShowForm(false)} style={{
              width:"100%",marginTop:10,padding:"12px",borderRadius:14,border:"1.5px solid #2a1f3d",
              background:"transparent",color:"#7c6a9e",fontSize:14,fontWeight:600
            }}>{t.cancel}</button>
          </div>
        </div>
      )}

      {confirmId&&confirmMed&&(
        <ConfirmDialog name={confirmMed.name} t={t} onConfirm={doRemove} onCancel={()=>setConfirmId(null)}/>
      )}

      {toast&&<Toast msg={toast} leaving={toastLeave}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
