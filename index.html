{meds.map(med => (
    <div key={med.id} style={{ background: "#19142e", padding: "20px", marginBottom: "15px", borderRadius: "16px", border: med.stock <= 5 ? "2px solid #ff6b6b" : "none" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start" }}>
            <div onClick={() => toggleTaken(med.id)} style={{ flexGrow: 1 }}>
                <span style={{ fontWeight: "bold", fontSize: "20px" }}>{med.name}</span>
                <div style={{ color: "#7c6a9e", marginBottom: "10px" }}>{med.dose}</div>
            </div>
            {/* Dugme za brisanje */}
            <button 
                onClick={() => setMeds(meds.filter(m => m.id !== med.id))} 
                style={{ background: "#ff6b6b", color: "white", padding: "5px 10px", borderRadius: "8px", border: "none", cursor: "pointer", fontSize: "14px" }}
            >
                ✕
            </button>
        </div>
        
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ background: "#10b981", padding: "4px 12px", borderRadius: "8px", fontWeight: "bold", color: "white" }}>
                {med.time} {med.taken ? "✅" : "⭕"}
            </div>
            <span style={{ color: med.stock <= 5 ? "#ff6b6b" : "#7c6a9e", fontWeight: "bold" }}>{med.stock} {t.remaining}</span>
        </div>
    </div>
))}
