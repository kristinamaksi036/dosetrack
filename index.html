<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoseTrack</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background-color: #0f0c1a; color: white; margin: 0; font-family: sans-serif; min-height: 100vh;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const translations = {
            en: { title: "DoseTrack", add: "+ Add", remaining: "left", medName: "Medicine Name", dose: "Dose", stock: "Stock", save: "Save", newMed: "New Medicine" },
            sr: { title: "DoseTrack", add: "+ Dodaj", remaining: "preostalo", medName: "Ime leka", dose: "Doza", stock: "Zaliha", save: "Sačuvaj", newMed: "Novi lek" }
        };

        function App() {
            const [lang, setLang] = useState('sr');
            const t = translations[lang];
            const [meds, setMeds] = useState(() => JSON.parse(localStorage.getItem("myMeds")) || []);
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({ name: "", dose: "", stock: 30, time: "08:00" });

            useEffect(() => { localStorage.setItem("myMeds", JSON.stringify(meds)); }, [meds]);

            return (
                <div style={{ width: "100%", padding: "20px", boxSizing: "border-box" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "25px" }}>
                        <h1 style={{ fontSize: "28px", fontWeight: "bold" }}>{t.title}</h1>
                        <div>
                            <button onClick={() => setLang(lang === 'en' ? 'sr' : 'en')} style={{ marginRight: "10px", background: "#333", padding: "5px 10px", borderRadius: "5px" }}>
                                {lang === 'en' ? '🇷🇸 SR' : '🇬🇧 EN'}
                            </button>
                            <button onClick={() => setShowForm(true)} style={{ background: "#a78bfa", padding: "10px 20px", borderRadius: "12px" }}>{t.add}</button>
                        </div>
                    </div>

                    {meds.map(med => (
                        <div key={med.id} style={{ background: "#19142e", padding: "20px", marginBottom: "15px", borderRadius: "16px" }}>
                            <div style={{ display: "flex", justifyContent: "space-between" }}>
                                <span style={{ fontWeight: "bold", fontSize: "20px" }}>{med.name}</span>
                                <span>{med.stock} {t.remaining}</span>
                            </div>
                        </div>
                    ))}

                    {showForm && (
                        <div style={{ position: "fixed", top: 0, left: 0, width: "100%", height: "100%", background: "#0f0c1a", padding: "20px" }}>
                            <h2>{t.newMed}</h2>
                            <input placeholder={t.medName} onChange={e => setForm({...form, name: e.target.value})} style={{ width: "100%", padding: "15px", marginBottom: "10px", background: "#19142e", color: "white" }} />
                            <button onClick={() => { setMeds([...meds, { id: Date.now(), ...form }]); setShowForm(false); }} style={{ width: "100%", padding: "15px", background: "#a78bfa" }}>{t.save}</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
